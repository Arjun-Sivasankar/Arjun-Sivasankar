<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-label="Arjun Sivasankar, AI Engineer and Data Scientist. I build AI that runs where the data lives.">
  <defs>
    <radialGradient id="spot" cx="0.78" cy="0.5" r="0.55">
      <stop stop-color="#e79b3c" stop-opacity=".10"/>
      <stop offset="1" stop-color="#e79b3c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f4f2ed" fill-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    .t { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #f4f2ed; }
    .muted { fill: #f4f2ed; fill-opacity: .62; }
    .soft { fill: #f4f2ed; fill-opacity: .45; }
    .node rect { fill: #12110f; stroke: #f4f2ed; stroke-opacity: .22; stroke-width: 1.5; }
    .node text { font-size: 23px; font-weight: 600; text-anchor: middle; }
    .path { fill: none; stroke: #f4f2ed; stroke-opacity: .16; stroke-width: 2; stroke-dasharray: 6 8; }
  </style>

  <rect width="1800" height="520" rx="28" fill="#0a0908"/>
  <rect width="1800" height="520" rx="28" fill="url(#dots)"/>
  <rect width="1800" height="520" rx="28" fill="url(#spot)"/>

  <!-- left: who -->
  <g class="t">
    <circle cx="96" cy="118" r="6" fill="#e79b3c"/>
    <text x="114" y="125" font-size="24" class="muted">AI Engineer and Data Scientist, Germany</text>
    <text x="88" y="214" font-size="84" font-weight="600" letter-spacing="-2.5">Arjun Sivasankar</text>
    <text x="90" y="284" font-size="38" font-weight="400" class="muted" letter-spacing="-0.6">I build AI that runs where the data lives.</text>
    <text x="90" y="372" font-size="27" class="soft">On-premise agents  /  retrieval  /  real-time speech  /  LoRA fine-tuning</text>
    <text x="90" y="418" font-size="27" class="soft">M.Sc. TU Dresden  /  IEEE ACDSA 2024  /  granted patent</text>
  </g>

  <!-- right: the voice loop, drawn the way it runs -->
  <g transform="translate(1110 96)">
    <path id="loop" class="path" d="M110,40 H510 V290 H110 Z"/>
    <circle r="14" fill="#e79b3c" opacity=".55" filter="url(#glow)">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="0"><mpath href="#loop"/></animateMotion>
    </circle>
    <circle r="7" fill="#e79b3c">
      <animateMotion dur="6s" repeatCount="indefinite" rotate="0"><mpath href="#loop"/></animateMotion>
    </circle>
    <g class="node t"><rect x="10" y="12" width="200" height="56" rx="14"/><text x="110" y="47">Speech to text</text></g>
    <g class="node t"><rect x="410" y="12" width="200" height="56" rx="14"/><text x="510" y="47">Agents + RAG</text></g>
    <g class="node t"><rect x="410" y="262" width="200" height="56" rx="14"/><text x="510" y="297">Validation</text></g>
    <g class="node t"><rect x="10" y="262" width="200" height="56" rx="14"/><text x="110" y="297">Text to speech</text></g>
    <g class="t" text-anchor="middle">
      <text x="310" y="152" font-size="22" class="soft">on our own GPUs</text>
      <text x="310" y="186" font-size="30" font-weight="600">~1.5 s</text>
      <text x="310" y="214" font-size="21" class="soft">question to spoken answer</text>
    </g>
  </g>
</svg>
